<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B13-A02-TechWave</title>

    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Fontawesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
<body class="inter">
    <!-- NAV Bar -->
    <nav
      class="px-5 py-4 sm:px-50 sm:py-4 flex justify-between items-center bg-[#1A0B2E] text-white max-w-400 mx-auto"
    >
      <p>
        <span class="text-4xl font-extrabold">Tech</span
        ><span
          class="text-4xl font-extrabold bg-linear-[5deg] from-[#F7E93F] via-[#FB09B4] to-[#9100F8] bg-clip-text text-transparent"
          >Wave</span
        >
      </p>
      <ul class="hidden sm:flex gap-8">
        <li><a href="#">About</a></li>
        <li><a href="#">Episodes</a></li>
        <li><a href="#">Host</a></li>
      </ul>
      <button
        class="hidden sm:block bg-linear-[35deg] from-[#F7E93F] via-[#FB09B4] to-[#9100F8] px-4 py-3 rounded-3xl transition-transform duration-300 hover:scale-105"
      >
        <a class="font-semibold" href="#">Subscribe</a>
        <i class="fa-solid fa-arrow-right"></i>
      </button>

      <button class="block sm:hidden">
        <i class="fa-solid fa-bars text-2xl"></i>
      </button>
    </nav>

    <main class="max-w-400 mx-auto text-white">
      <!-- Banner Section  -->
      <section class="bg-[#1A0B2E]">
        <div
          class="banner_content bg-[url(./assets/hero-bg.png)] bg-contain bg-position-[center_20%] sm:bg-center bg-no-repeat flex flex-col justify-center items-center text-center py-10 sm:py-25"
        >
          <!-- logo -->
          <div
            class="logo-content relative w-50 h-50 sm:w-87.5 sm:h-87.5 mb-10"
          >
            <img
              class="w-full h-full object-contain"
              src="./assets/hero-circle.png"
              alt=""
            />
            <div class="absolute inset-0 flex justify-center items-center">
              <img
                class="w-20 h-20 sm:w-50 sm:h-50 object-contain"
                src="./assets/microphone.png"
                alt=""
              />
            </div>
            <div
              class="absolute top-2 right-2 sm:top-4 sm:right-4 bg-[#00FF88] rounded-4xl font-semibold px-4 py-2 text-black"
            >
              NEW
            </div>
          </div>
          <!-- header & text -->
          <div>
            <h2 class="font-extrabold text-6xl mb-2">TechWave</h2>
            <p class="font-normal text-base mb-6 text-center">
              Your daily dose of tech insights, productivity hacks, and personal
              growth
            </p>
          </div>
          <!-- buttons -->
          <div class="flex gap-2">
            <!-- button 1 -->
            <button
              class="flex gap-2 justify-center items-center bg-linear-[35deg] from-[#F7E93F] via-[#FB09B4] to-[#9100F8] px-5 py-3 rounded-3xl transition-transform duration-300 hover:scale-105"
              type="button"
            >
              <img
                class="w-5 h-5 object-contain"
                src="./assets/spotify.png"
                alt=""
              />
              <a class="font-semibold text-base" href="#">Listen on Spotify</a>
            </button>
            <!-- button 2 -->
            <button
              class="flex gap-2 justify-center items-center border-2 border-[#00FF88] px-5 py-3 rounded-3xl text-[#00FF88] transition-transform duration-300 hover:scale-105"
            >
              <img
                class="w-5 h-5 object-contain"
                src="./assets/message.png"
                alt=""
              />
              <a class="font-semibold" href="#">Subscribe</a>
            </button>
          </div>
        </div>
      </section>
    </main>

</body>
</html>
